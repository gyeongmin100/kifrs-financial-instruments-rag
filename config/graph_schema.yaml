schema_version: "1.0"
database:
  engine: neo4j
  minimum_major_version: 5
  minimum_minor_version: 15

embedding:
  provider: openai
  model: text-embedding-3-large
  dimensions: 3072
  similarity_function: cosine
  property: embedding
  index: chunk_embedding_vector
  rebuild_index_when_dimensions_change: true

indexes:
  chunk_fulltext:
    name: chunk_fulltext
    properties: [text, contextualized_text, citation_label]
    analyzer: cjk
  chunk_vector:
    name: chunk_embedding_vector
    property: embedding
    dimensions: 3072
    similarity_function: cosine

ids:
  Standard: standard_id
  Zone: zone_id
  Section: section_id
  Paragraph: paragraph_id
  Subparagraph: subparagraph_id
  Block: block_id
  Table: table_id
  Footnote: footnote_id
  PdfPage: page_id
  Chunk: chunk_id
  ExternalStandard: external_standard_id
  Concept: concept_id
  Rule: rule_id
  Condition: condition_id
  Exception: exception_id
  Example: example_id

id_rules:
  Standard: "source standard_id (for example 1032)"
  Zone: "KIFRS{standard_id}-Z-{zone}"
  Section: "KIFRS{standard_id}-SEC-{sha256(normalized_section_path)[0:16]}"
  Paragraph: "source paragraph_id"
  Subparagraph: "{paragraph_id}-S{one_based_order:02d}"
  Block: "source block_id"
  Table: "source table_id"
  Footnote: "source footnote_id"
  PdfPage: "KIFRS{standard_id}-PAGE-{pdf_page:04d}"
  Chunk: "source chunk_id"
  ExternalStandard: "normalized cited standard identifier"
  Concept: "CONCEPT-{sha256(normalized_canonical_name)[0:20]}"
  inferred_semantic_nodes: "{label.upper()}-{sha256(canonical_text|source_paragraph_id)[0:20]}"

grades:
  A:
    meaning: deterministic_source_fact
    auto_load: true
    default_confidence: 1.0
    default_review_status: approved
    sources: [parser, chunk_builder, reference_parser, page_mapper]
  B:
    meaning: openai_candidate_verified_against_source_span
    auto_load: candidate_store_only
    searchable_only_when_review_status: approved
  C:
    meaning: unverified_or_ambiguous_candidate
    auto_load: false
    searchable: false

nodes:
  Standard:
    grade: A
    source: data/processed/document_manifest.json
    properties: [standard_id, title, version, source_file, source_sha256, paragraph_count, block_count, table_count, footnote_count, reference_count]
  Zone:
    grade: A
    source_fields: [standard_id, zone]
    properties: [zone_id, standard_id, type, search_priority, order]
  Section:
    grade: A
    source_field: section_path
    properties: [section_id, standard_id, title, level, order, path, path_key]
  Paragraph:
    grade: A
    source: data/processed/paragraphs.jsonl
    properties: [paragraph_id, standard_id, number, text, document_order, occurrence, zone, source_section, xml_index, pdf_page_start, pdf_page_end, page_match_confidence, page_match_method, page_match_ambiguous]
  Subparagraph:
    grade: A
    source: paragraphs.jsonl.subitems
    properties: [subparagraph_id, paragraph_id, marker, text, level, order, xml_index]
  Block:
    grade: A
    source: data/processed/blocks.jsonl
    properties: [block_id, standard_id, parent_paragraph_id, block_type, text, document_order, zone, searchable, search_priority, source_section, xml_index]
  Table:
    grade: A
    source: data/processed/tables.jsonl
    properties: [table_id, standard_id, parent_paragraph_id, rows, columns, repeat_header, serialized_text, cells_json, zone, pdf_page_start, pdf_page_end, page_match_confidence]
  Footnote:
    grade: A
    source: data/processed/footnotes.jsonl
    properties: [footnote_id, standard_id, parent_paragraph_id, number, text, zone, pdf_page_start, pdf_page_end, page_match_confidence]
  PdfPage:
    grade: A
    source: data/processed/pdf_pages.jsonl
    properties: [page_id, standard_id, pdf_page, pdf_page_label, text, char_count]
  Chunk:
    grade: A
    source: data/chunks/chunks.jsonl
    properties: [chunk_id, standard_id, chunk_type, text, contextualized_text, citation_label, document_order, part_index, part_count, char_count, word_count, search_priority, searchable, inactive, inactive_reason, pdf_page_start, pdf_page_end, page_match_confidence, source_sha256, embedding]
  ExternalStandard:
    grade: A
    source: data/processed/references.jsonl
    properties: [external_standard_id, title, loaded]
  Concept:
    grade: A
    source: official definition tables and definition blocks
    properties: [concept_id, canonical_name, aliases, alias_search_text, definition, definitions_json, standard_ids, source_ids, extractor_model, extractor_version, review_status]
  Rule:
    grade: B
    properties: [rule_id, statement, rule_type, extractor_model, extractor_version, review_status]
  Condition:
    grade: B
    properties: [condition_id, statement, extractor_model, extractor_version, review_status]
  Exception:
    grade: B
    properties: [exception_id, statement, extractor_model, extractor_version, review_status]
  Example:
    grade: B
    properties: [example_id, statement, extractor_model, extractor_version, review_status]

relationship_properties:
  required: [provenance, confidence, review_status]
  provenance_detail: [source_id, source_paragraph_id, source_text_span, extractor_model, extractor_version, method, reference_id, reference_group_id]
  review_status_values: [approved, candidate, rejected]

relationships:
  CONTAINS:
    grade: A
    directions: [Standard->Zone, Standard->PdfPage, Zone->Section, Section->Section, Section->Paragraph, Paragraph->Subparagraph, Subparagraph->Subparagraph]
  NEXT:
    grade: A
    directions: [Section->Section, Paragraph->Paragraph, Subparagraph->Subparagraph, PdfPage->PdfPage]
    note: stored_forward_only_queried_both_directions
  HAS_BLOCK:
    grade: A
    directions: [Paragraph->Block, Section->Block]
  HAS_TABLE:
    grade: A
    directions: [Paragraph->Table, Block->Table]
  HAS_FOOTNOTE:
    grade: A
    directions: [Paragraph->Footnote, Block->Footnote]
  APPEARS_ON:
    grade: A
    directions: [Paragraph->PdfPage, Block->PdfPage, Table->PdfPage, Footnote->PdfPage, Chunk->PdfPage]
  DERIVED_FROM:
    grade: A
    directions: [Chunk->Paragraph, Chunk->Subparagraph, Chunk->Block, Chunk->Table, Chunk->Footnote]
  REFERS_TO:
    grade: A
    directions: [Paragraph->Paragraph, Paragraph->Subparagraph, Paragraph->Standard, Paragraph->ExternalStandard, Block->Paragraph, Block->Subparagraph, Block->Standard, Block->ExternalStandard, Table->Paragraph, Table->Standard, Table->ExternalStandard, Footnote->Paragraph, Footnote->Standard, Footnote->ExternalStandard]
    load_statuses: [resolved, resolved_range, resolved_standard, external_standard]
  MENTIONS:
    grade: A
    directions: [Paragraph->Concept, Block->Concept, Table->Concept]
    source: official definitions plus exact lexical matching
  ESTABLISHES:
    grade: B
    directions: [Paragraph->Rule]
  HAS_CONDITION:
    grade: B
    directions: [Rule->Condition]
  HAS_EXCEPTION:
    grade: B
    directions: [Rule->Exception]
  APPLIES_TO:
    grade: B
    directions: [Rule->Concept]
  ILLUSTRATES:
    grade: B
    directions: [Example->Rule]
  EXPLAINS:
    grade: B
    directions: [Paragraph->Paragraph]

traversal:
  semantic_and_reference:
    default_hops: 2
    maximum_hops: 3
    allowed_relationships: [REFERS_TO, MENTIONS, ESTABLISHES, HAS_CONDITION, HAS_EXCEPTION, APPLIES_TO, ILLUSTRATES, EXPLAINS]
    semantic_review_status: approved
  hierarchy:
    maximum_hops: 6
    allowed_relationships: [CONTAINS, HAS_BLOCK, HAS_TABLE, HAS_FOOTNOTE, DERIVED_FROM, APPEARS_ON]
  adjacency:
    relationship: NEXT
    window: 1
    direction: both
